name: own-trello

services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-trello}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trello} -d ${POSTGRES_DB:-trello}",
        ]
      interval: 5s
      retries: 5
      timeout: 5s

  migrate:
    container_name: migrate
    image: "pgvector/pgvector:pg16"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-trello}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
    command: ["bin/bash", "/scripts/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
